name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Windows app
        shell: pwsh
        run: ./build.ps1
      - name: Package public Windows ZIP
        shell: pwsh
        run: ./package.ps1
      - name: Upload portable Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NasDesktop-windows-x64
          path: |
            dist/NasDesktop-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  attest:
    # Only a public repository's trusted default branch receives signing permissions.
    if: >-
      github.event_name != 'pull_request' &&
      github.event.repository.visibility == 'public' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download this build's public package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NasDesktop-windows-x64
          path: dist
      - name: Extract the exact packaged executable
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS.txt
          unzip -p NasDesktop-windows-x64.zip NasDesktop.exe > NasDesktop.exe
          test -s NasDesktop.exe
      - name: Attest the CI-built ZIP and executable
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/NasDesktop-windows-x64.zip
            dist/NasDesktop.exe
          create-storage-record: false
      - name: Verify both subjects before exporting provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for artifact in dist/NasDesktop-windows-x64.zip dist/NasDesktop.exe; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$ATTESTATION_BUNDLE" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Upload build provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NasDesktop-build-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
